[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalidriver"
version = "3.0.0"
description = "Hardware, driver, firmware and system maintenance assistant for Kali Linux"
requires-python = ">=3.10"
dependencies = ["rich>=13.7"]

[project.scripts]
kalidriver = "kaliDriver:main"
